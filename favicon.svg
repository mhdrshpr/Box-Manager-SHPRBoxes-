<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Cardboard Base Box -->
  <rect x="8" y="16" width="48" height="40" rx="6" fill="#dfb382" stroke="#bd9062" stroke-width="3"/>
  <!-- Top Flap Fold Line -->
  <line x1="8" y1="26" x2="56" y2="26" stroke="#b28556" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Sealing Tape -->
  <rect x="27" y="16" width="10" height="40" fill="#cf9b5b" opacity="0.9"/>
  <!-- Shipping Label on Box -->
  <rect x="14" y="32" width="18" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="17" y1="36" x2="28" y2="36" stroke="#1e293b" stroke-width="2"/>
  <line x1="17" y1="40" x2="25" y2="40" stroke="#64748b" stroke-width="1.5"/>
  <!-- Handle Cutout -->
  <rect x="42" y="35" width="8" height="4" rx="2" fill="#8b6b4e" opacity="0.6"/>
</svg>
